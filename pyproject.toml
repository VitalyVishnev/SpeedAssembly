[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-to-usda-converter"
version = "0.1.0"
description = "Observed-schema SpeedTree Raw XML to USDA converter scaffold for UE 5.7 skeletal nanite assemblies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xml-to-usda = "xml_to_usda.cli:main"
xml-to-usda-gui = "xml_to_usda.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
