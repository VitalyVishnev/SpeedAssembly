[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-to-usda-converter"
version = "0.1.0"
description = "SpeedAssembly: SpeedTree Raw XML to USDA converter for UE 5.7–5.8 skeletal Nanite Assembly workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Vitaly Vishnev" }
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<2",
  "fast-simplification>=0.1.9,<1",
  "manifold3d>=3.5,<4",
  "defusedxml>=0.7,<1",
  "usd-core>=24.8,<26",
]

[project.optional-dependencies]
ui-next = ["PySide6>=6.8,<7"]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "pytest-qt>=4.4"]

[project.scripts]
xml-to-usda = "xml_to_usda.cli:main"
xml-to-usda-gui = "xml_to_usda.qt_ui.entry:main"
xml-to-usda-gui-next = "xml_to_usda.qt_ui.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xml_to_usda.qt_ui" = ["themes/default/theme.json", "themes/default/assets/*.ppm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest_tmp", "-m", "not stress and not packaged"]
markers = [
  "core: fast deterministic contract tests",
  "integration: source, worker, or Qt workflow tests",
  "packaged: frozen executable boundary tests",
  "qt: Qt workflow and UI shell tests",
  "stress: heavy or long-running local stress checks",
  "ue_manual: manual UE 5.7 import validation checklist only",
]
