[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-to-usda-converter"
version = "0.1.0"
description = "Observed-schema SpeedTree Raw XML to USDA converter scaffold for UE 5.7 skeletal nanite assemblies."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.optional-dependencies]
ui-next = ["PySide6>=6.8,<7"]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "pytest-qt>=4.4"]

[project.scripts]
xml-to-usda = "xml_to_usda.cli:main"
xml-to-usda-gui = "xml_to_usda.gui:main"
xml-to-usda-gui-next = "xml_to_usda.qt_ui.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xml_to_usda.qt_ui" = ["themes/default/theme.json", "themes/default/assets/*.ppm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
