[package]
name = "speedassembly-xml-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false

[lib]
name = "_xml_reader"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module"] }
roxmltree = "=0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1
