site_name: SpeedAssembly Documentation
site_description: User documentation for the SpeedAssembly vegetation pipeline tool.
site_url: https://vitalyvishnev.github.io/SpeedAssembly/
repo_url: https://github.com/VitalyVishnev/SpeedAssembly
repo_name: VitalyVishnev/SpeedAssembly
edit_uri: edit/master/Project/docs/user/
docs_dir: docs/user
site_dir: site
strict: true
watch:
  - docs/overrides

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  font: false
  palette:
    - scheme: speedassembly
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview:
      - index.md
      - What is SpeedAssembly?: overview/what-is-speedassembly.md
      - Pipeline overview: concepts/pipeline-overview.md
  - Basic workflow:
      - Prepare Unreal Engine: workflows/prepare-unreal.md
      - Prepare SpeedTree: workflows/prepare-speedtree.md
      - Convert in SpeedAssembly: workflows/basic-conversion.md
      - Import into Unreal Engine: workflows/unreal-import.md
  - Workflows:
      - Proxy Mesh: workflows/proxy-mesh.md
      - UDIM workflow: workflows/udim.md
  - Wiki:
      - XML, USD, USDA, and JSON: wiki/xml-usd-usda-json.md
      - Choosing what to instance: wiki/choosing-assembly-parts.md
      - How Dynamic Wind works: wiki/how-dynamic-wind-works.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      # Our contextual switcher is refreshed after Material's instant navigation.
      reconfigure_material: false
      languages:
        - locale: en
          default: true
          name: ENG
          build: true
        - locale: ru
          name: RU
          build: true
          theme:
            language: ru
          site_name: Документация SpeedAssembly
          site_description: Руководство пользователя SpeedAssembly для работы с растительностью.
          nav_translations:
            Overview: Обзор
            What is SpeedAssembly?: Что такое SpeedAssembly?
            Pipeline overview: Обзор pipeline
            Basic workflow: Основной workflow
            Prepare Unreal Engine: Подготовка Unreal Engine
            Prepare SpeedTree: Подготовка SpeedTree
            Convert in SpeedAssembly: Конвертация в SpeedAssembly
            Import into Unreal Engine: Импорт в Unreal Engine
            Wiki: Вики
            XML, USD, USDA, and JSON: XML, USD, USDA и JSON
            Choosing what to instance: Выбор геометрии для инстансинга
            How Dynamic Wind works: Как работает Dynamic Wind

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/navigation.js

exclude_docs: |
  .obsidian/
  _drafts/
  _templates/
  troubleshooting/faq.md
  troubleshooting/faq.ru.md

copyright: Copyright &copy; 2026 Vitaly Vishnev

extra:
  generator: false
  alternate:
    - name: ENG
      lang: en
      link: /SpeedAssembly/
    - name: RU
      lang: ru
      link: /SpeedAssembly/ru/
