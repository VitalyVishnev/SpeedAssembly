name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - "Project/docs/user/**"
      - "Project/docs/overrides/**"
      - "Project/mkdocs.yml"
      - "Project/requirements-docs.txt"
      - "Project/scripts/check_documentation.py"
      - "Project/scripts/check_documentation_navigation.cjs"
      - "Project/scripts/package*.json"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Project
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Project/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Check bilingual documentation
        run: python scripts/check_documentation.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Project/scripts/package-lock.json

      - name: Install documentation browser dependencies
        run: |
          npm ci --prefix scripts
          npx --prefix scripts playwright install --with-deps chromium

      - name: Check documentation navigation
        run: node scripts/check_documentation_navigation.cjs site check 240

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Project/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
